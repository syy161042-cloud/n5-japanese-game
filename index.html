<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245f49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>N5 かな Quest · 日语学习与闯关</title>
<style>
:root{--bg:#f7f8f2;--ink:#172b25;--muted:#6b7b74;--green:#2f805f;--green2:#dff3e7;--line:#dce5dc;--blue:#376da8;--blue2:#e8f1ff;--gold:#e6b94f;--pink:#d85d69;--pink2:#ffedf0;--card:#fff;--shadow:0 10px 28px rgba(25,55,42,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:ui-rounded,"SF Pro Rounded","Noto Sans SC","PingFang SC",system-ui,-apple-system,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #7aadeb;outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:18px 18px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.3px;font-size:20px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 5px 0 #205b42}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:1px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 12px;min-width:76px;text-align:center;font-weight:850;font-size:14px}
.stat span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px;margin-top:2px}
.hero{background:#245f49;color:#fff;border-radius:24px;padding:24px 25px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"あ";position:absolute;right:23px;top:-28px;font-size:170px;line-height:1;font-weight:900;color:rgba(255,255,255,.08);transform:rotate(9deg);pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:900;opacity:.78;text-transform:uppercase}
.hero h1{margin:8px 0 9px;font-size:clamp(25px,4vw,36px);letter-spacing:-1px;line-height:1.12;max-width:690px}
.hero p{margin:0;color:#d8eee2;max-width:650px;line-height:1.6;font-size:14px}
.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:22px;position:relative;z-index:1}
.daily-progress{flex:1;max-width:470px}
.progress-label{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:750;margin-bottom:8px;color:#e1f2e7}
.bar{height:9px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:#f5cf65;border-radius:99px;transition:width .25s}
.primary{border:0;background:#f5cf65;color:#263326;padding:13px 18px;border-radius:14px;font-weight:900;box-shadow:0 4px 0 #c59a36;transition:transform .08s;white-space:nowrap}
.primary:active,.choice:active,.mode-card:active{transform:translateY(2px)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:25px 2px 12px}
.section-head h2{margin:0;font-size:19px;letter-spacing:-.4px}
.section-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.pill{border-radius:99px;padding:6px 10px;font-size:11px;font-weight:850;background:var(--green2);color:var(--green)}
.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode-card{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:17px;text-align:left;display:flex;flex-direction:column;min-height:146px;box-shadow:0 4px 0 rgba(25,55,42,.03);transition:transform .1s,border-color .1s}
.mode-card:hover{border-color:#a9cdb7;transform:translateY(-1px)}
.mode-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;margin-bottom:13px}
.mode-card strong{font-size:15px}
.mode-card small{color:var(--muted);line-height:1.5;font-size:12px;margin-top:5px}
.mode-card .card-foot{margin-top:auto;padding-top:13px;display:flex;align-items:center;justify-content:space-between;color:var(--green);font-weight:900;font-size:12px}
.mode-card .card-foot span:last-child{font-size:18px}
.icon-mixed{background:#fff1c6}.icon-word{background:#dff3e7}.icon-grammar{background:#e5efff}.icon-verb{background:#f8e7ff}.icon-kanji{background:#ffe6e1}.icon-wrong{background:#ffe9ed}
.layout-two{display:grid;grid-template-columns:1.4fr .9fr;gap:14px;margin-top:16px}
.panel{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0;font-size:15px}
.panel .sub{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.plan-row{display:flex;gap:12px;align-items:flex-start;margin-top:15px}
.day-number{width:48px;height:48px;flex:none;border-radius:15px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-weight:950;font-size:18px}
.plan-content{flex:1}
.plan-content strong{font-size:13px}
.plan-content p{margin:5px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:12px;font-size:12px;font-weight:850}
.secondary:hover{border-color:#9dbdab}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini-stat{border-radius:13px;background:#f7f9f5;padding:12px 10px}
.mini-stat b{display:block;font-size:20px}
.mini-stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.footer-note{margin:20px 2px 0;font-size:11px;line-height:1.7;color:var(--muted)}
.game-wrap{max-width:760px;margin:0 auto}
.game-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.close-game{border:0;background:transparent;color:var(--muted);font-size:26px;padding:4px 7px}
.game-meter{flex:1;background:#e1e8df;height:11px;border-radius:99px;overflow:hidden}
.game-meter span{display:block;width:0;height:100%;background:var(--green);border-radius:99px;transition:width .2s}
.hearts{font-size:16px;white-space:nowrap}
.game-kicker{font-weight:900;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.question-card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(20px,4vw,32px);box-shadow:var(--shadow)}
.question-card h2{font-size:clamp(24px,4.5vw,34px);letter-spacing:-.8px;line-height:1.25;margin:10px 0}
.question-sub{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 23px}
.question-prompt{font-weight:900;font-size:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.choice{border:1.5px solid #d7e1d8;background:#fff;border-radius:15px;padding:15px 14px;text-align:left;font-weight:750;line-height:1.5;min-height:64px;transition:background .1s,border-color .1s,transform .08s;overflow-wrap:anywhere}
.choice:hover{background:#f7faf5;border-color:#90b7a0}
.choice.correct{background:#def5e6;border-color:#54a779;color:#1f6643}
.choice.wrong{background:#ffeaed;border-color:#e2747d;color:#982f3c}
.feedback{margin-top:16px;padding:15px;border-radius:15px;display:none}
.feedback.show{display:block}
.feedback.good{background:#e6f6eb;color:#205b3f}
.feedback.bad{background:#fff0f1;color:#963742}
.feedback strong{font-size:17px}
.feedback p{font-size:12px;line-height:1.7;margin:6px 0 0;white-space:normal}
.game-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px}
.muted-small{font-size:11px;color:var(--muted)}
.next-button{border:0;background:var(--green);color:#fff;border-radius:14px;padding:13px 19px;font-weight:900;box-shadow:0 4px 0 #205b42;min-width:120px}
.next-button:disabled{opacity:.4;cursor:default}
.result-card{text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 22px;box-shadow:var(--shadow)}
.result-emoji{font-size:50px}
.result-card h2{font-size:29px;margin:12px 0 7px}
.result-card p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto;max-width:490px}
.result-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.result-metrics div{background:#f6f8f3;border-radius:15px;padding:14px 8px}
.result-metrics b{display:block;font-size:23px}
.result-metrics span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.result-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
@media(max-width:730px){.app{padding:12px 12px 32px}.topbar{align-items:flex-start}.brand{font-size:17px}.brand-mark{width:38px;height:38px}.stat{min-width:57px;padding:8px 9px;font-size:12px}.stat span{font-size:9px}.hero{padding:21px 19px}.hero:after{right:0;font-size:130px}.hero-bottom{align-items:flex-start;flex-direction:column}.primary{width:100%}.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mode-card{padding:13px;min-height:143px}.layout-two{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.choice{min-height:55px}.section-head{margin-top:22px}.game-top{gap:8px}.question-card{padding:20px 16px}.game-actions{align-items:stretch}.game-actions .muted-small{display:none}.next-button{flex:1}}
@media(max-width:380px){.stats{gap:4px}.stat{min-width:51px;padding:7px 6px}.mode-card strong{font-size:13px}.mode-card small{font-size:11px}}

.learn-wrap{max-width:760px;margin:0 auto}
.learn-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:var(--shadow)}
.learn-reading{font-size:clamp(14px,2vw,18px);font-weight:750;color:var(--blue);letter-spacing:1px;text-align:center;margin:18px 0 5px;line-height:1.9}
.learn-word{font-size:clamp(34px,8vw,58px);font-weight:950;letter-spacing:1px;text-align:center;line-height:1.5;margin:7px 0 18px;overflow-wrap:anywhere}
ruby{ruby-position:over;ruby-align:center} rt{font-size:.42em;font-weight:750;color:#376da8;letter-spacing:0;line-height:1.2}
.word-meaning{font-size:clamp(20px,4vw,27px);font-weight:900;text-align:center;margin:8px 0 14px}
.learn-tag{display:inline-block;background:#e4f1e9;color:#245f49;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:850}
.learn-info{background:#f7f9f5;border-radius:16px;padding:15px 17px;line-height:1.8;font-size:14px;margin:12px 0;color:#34483d}
.learn-info strong{color:#245f49}
.learn-controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:18px}
.learn-progress{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:16px}
.learn-progress .bar{flex:1;background:#e5ebe4}.learn-progress .bar span{background:var(--green)}
.lesson-help{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin-top:16px}
.lesson-example{font-size:clamp(18px,3.5vw,24px);font-weight:850;line-height:2;text-align:center;margin:12px 0}
.pronounce{border:1px solid #c9dcd0;background:#f5faf6;color:#245f49;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:850}
.mode-card.learn-mode{border-color:#b4d6c0;background:linear-gradient(135deg,#fff 70%,#eaf7ee)}
.mode-card.learn-grammar{border-color:#c3d6f1;background:linear-gradient(135deg,#fff 70%,#eef4ff)}
@media(max-width:720px){.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-bottom{align-items:stretch;flex-direction:column}.layout-two{grid-template-columns:1fr}.topbar{align-items:flex-start}.stats{gap:5px}.stat{min-width:61px;padding:8px 9px}.learn-controls>*{flex:1}.learn-controls .primary{white-space:normal}}

</style>
</head>

</div>

间里有人。","提醒":"地点常用に，存在物常用が。"},{"类别":"形容词","易混项":"い形容词 vs な形容词","规则/区别":"い形容词通常以い结尾；な形容词修饰名词时要加な。","例句":"新しい本／静かな町","中文":"新书／安静的城镇","提醒":"きれい、嫌い等以い音结尾但属于な形容词。"},{"类别":"时间","易混项":"具体时刻 + に","规则/区别":"七時、三月十日等具体时间点通常加に。","例句":"七時に起きます。","中文":"七点起床。","提醒":"今日、明日、毎日等一般不加に。"},{"类别":"动词","易混项":"ます形 vs 辞书形","规则/区别":"礼貌对话多用ます形；词典和不少语法接续会用辞书形。","例句":"食べます／食べる前に","中文":"吃／吃之前","提醒":"先掌握词典形与ます形的对应关系。"},{"类别":"动词","易混项":"帰る／入る／走る","规则/区别":"这些看似以る结尾，但属于五段动词。","例句":"帰ります・帰って・帰らない","中文":"回去的ます形、て形、ない形","提醒":"不能像食べる那样只去掉る。"},{"类别":"动词","易混项":"着る vs 切る","规则/区别":"同音词，但动词类型和变形不同。","例句":"着ます・着て／切ります・切って","中文":"穿／切","提醒":"着る是一段；切る是五段。"},{"类别":"动词","易混项":"行く的て形","规则/区别":"行く的て形和た形特殊变化。","例句":"行って／行った","中文":"去；去了","提醒":"不要套普通的く→いて规则。"},{"类别":"存在","易混项":"あります的否定","规则/区别":"ある的否定是ない。","例句":"本がないです。","中文":"没有书。","提醒":"不要说「あらない」。"},{"类别":"疑问词","易混项":"何：なに／なん","规则/区别":"何时读なに，何人、何時、何曜日等固定搭配读なん。","例句":"何ですか。／何時ですか。","中文":"是什么？／几点？","提醒":"记固定搭配比硬背单一读音有效。"},{"类别":"程度","易混项":"あまり／全然","规则/区别":"常与否定搭配，分别表示“不太……”和“完全不……”。","例句":"あまり食べません。／全然分かりません。","中文":"不太吃。／完全不懂。","提醒":"现代口语中也能见到肯定搭配，但备考先掌握常见否定句。"},{"类别":"时间副词","易混项":"もう vs まだ","规则/区别":"もう常表示已经；まだ表示还、仍然，常见「まだ～ていません」。","例句":"もう食べました。／まだ食べていません。","中文":"已经吃了。／还没吃。","提醒":"注意句子时态与完成状态。"},{"类别":"频率","易混项":"いつも／よく／時々","规则/区别":"总是／经常／有时。","例句":"いつも勉強します。","中文":"总是学习。","提醒":"副词通常放在动作或状态前。"},{"类别":"频率","易混项":"あまり／全然 + 否定","规则/区别":"不太……／完全不……","例句":"あまり見ません。","中文":"不太看。","提醒":"和程度副词放一起记。"},{"类别":"比较","易混项":"AよりBのほうが……","规则/区别":"B比A更……","例句":"電車よりバスのほうが安いです。","中文":"公交车比电车便宜。","提醒":"より后面一般是被比较的一方。"},{"类别":"量词","易混项":"人","规则/区别":"ひとり、ふたり，之后通常为さんにん、よにん……","例句":"一人、二人、三人","中文":"一个人、两个人、三个人","提醒":"1人、2人为特殊读法。"},{"类别":"量词","易混项":"本","规则/区别":"数细长物、瓶、伞等；发音会变。","例句":"一本、二本、三本、何本","中文":"いっぽん、にほん、さんぼん、なんぼん","提醒":"注意促音与浊音。"},{"类别":"量词","易混项":"匹","规则/区别":"数猫、狗等小动物；发音会变。","例句":"一匹、二匹、三匹、何匹","中文":"いっぴき、にひき、さんびき、なんびき","提醒":"注意促音与浊音。"},{"类别":"日期","易混项":"1日～10日","规则/区别":"日期有大量特殊读法，建议单独背。","例句":"ついたち、ふつか、みっか、よっか、いつか","中文":"1号、2号、3号、4号、5号","提醒":"不要全部按数字 + 日的普通读法推。"},{"类别":"日期","易混项":"1 function defaultState(){ return {xp:0,answered:0,correct:0,streak:0,lastStudyDate:"",day:1,advancedDate:"",dailyDate:todayKey(),dailyXP:0,missed:{},sessions:0,vocabCursor:0,grammarCursor:0,verbsCursor:0,kanjiCursor:0,trapsCursor:0,learnedVocab:[],learnedGrammar:[],learnedVerbs:[],learnedKanji:[],learnedTraps:[]}; }
function loadState(){ try { const current=localStorage.getItem(STORE); const v=JSON.parse(current||localStorage.getItem("kanaQuestN5_v1")||"null"); const merged=v&&typeof v==="object"?Object.assign(defaultState(),v):defaultState(); if(!current&&v){merged.missed={};localStorage.setItem(STORE,JSON.stringify(merged));} return merged; } catch(e){ return defaultState(); } }

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b; }
function unique(a){return [...new Set(a.filter(x=>String(x??"").trim()!=="").map(x=>String(x)))];}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length));}
function makePool(kind){
  const out=[];
  if(kind==="vocab"||kind==="daily"||kind==="review"){
    DATA.vocab.forEach(r=>{
      const seq=r["序号"], jp=r["日文表记"], kana=r["假名读音"], cn=r["中文释义"], topic=r["主题"];
      if(jp&&cn){
        out.push({id:`vocab:${seq}:jp-cn`,kind:"vocab",base:`vocab:${seq}`,prompt:jp,sub:`读音：${kana||jp}　·　${topic||"词汇"}`,answer:cn,detail:[`日语：${jp}`,`假名：${kana||jp}`,`中文：${cn}`]});
        out.push({id:`vocab:${seq}:cn-jp`,kind:"vocab",base:`vocab:${seq}`,prompt:cn,sub:`根据中文回忆日语　·　${topic||"词汇"}`,answer:jp,detail:[`日语：${jp}`,`假名：${kana||jp}`,`中文：${cn}`]});
      }
    });
  }
  if(kind==="grammar"||kind==="daily"||kind==="review"){
    DATA.grammar.forEach(r=>{
      const seq=r["序号"], name=r["句型/语法"], meaning=r["核心意思"];
      if(name&&meaning) out.push({id:`grammar:${seq}`,kind:"grammar",base:`grammar:${seq}`,prompt:name,sub:`模块：${r["模块"]||"语法"}　·　先判断句型意思`,answer:meaning,detail:[`接续：${r["接续/规则"]||"见例句"}`,`例句：${r["日语例句"]||""}`,`翻译：${r["中文翻译"]||""}`,r["易错提醒"]?`易错提醒：${r["易错提醒"]}`:""]});
    });
  }
  if(kind==="verbs"||kind==="daily"||kind==="review"){
    const forms=["ます形","て形","た形","ない形"];
    DATA.verbs.forEach((r,i)=>{
      forms.forEach(form=>{
        const seq=r["辞书形"]||i;
        const answer=r[form];
        if(answer) out.push({id:`verbs:${i}:${form}`,kind:"verbs",base:`verbs:${i}`,prompt:`「${r["辞书形"]}」的${form}是什么？`,sub:`读音：${r["读音"]||""}　·　意思：${r["中文"]||""}`,answer:String(answer),detail:[`辞书形：${r["辞书形"]}（${r["读音"]||""}）`,`ます形：${r["ます形"]||""}；て形：${r["て形"]||""}`,`た形：${r["た形"]||""}；ない形：${r["ない形"]||""}`,r["记忆提示"]?`记忆提示：${r["记忆提示"]}`:""]});
      });
    });
  }
  if(kind==="kanji"||kind==="daily"||kind==="review"){
    DATA.kanji.forEach((r,i)=>{
      const seq=r["序号"]??i, ch=r["汉字"], meaning=r["中文含义"];
      if(ch&&meaning) out.push({id:`kanji:${seq}`,kind:"kanji",base:`kanji:${seq}`,prompt:`汉字「${ch}」的常见含义是？`,sub:`常见读音：${r["常见读音"]||"见词例"}`,answer:String(meaning),detail:[`汉字：${ch}`,`常见读音：${r["常见读音"]||""}`,`词例：${r["词例"]||""}（${r["词例读音"]||""}）`,`词例释义：${r["词例释义"]||""}`]});
    });
  }
  if(kind==="traps"||kind==="daily"||kind==="review"){
    DATA.traps.forEach((r,i)=>{
      const key=r["易混项"]||r["类别"]||`第${i+1}项`;
      const rule=r["规则/区别"];
      if(key&&rule) out.push({id:`traps:${i}`,kind:"traps",base:`traps:${i}`,prompt:`「${key}」的正确区别是什么？`,sub:`类别：${r["类别"]||"易错点"}`,answer:String(rule),detail:[`例句：${r["例句"]||""}`,`中文：${r["中文"]||""}`,r["提醒"]?`提醒：${r["提醒"]}`:""]});
    });
  }
  return out;
}
const POOLS={vocab:makePool("vocab"),grammar:makePool("grammar"),verbs:makePool("verbs"),kanji:makePool("kanji"),traps:makePool("traps")};
function getLearnedPool(kind){
  const pool=POOLS[kind]||[];
  let learned=[];
  if(kind==="vocab") learned=state.learnedVocab||[];
  if(kind==="grammar") learned=state.learnedGrammar||[];
  if(kind==="verbs") learned=state.learnedVerbs||[];
  if(kind==="kanji") learned=state.learnedKanji||[];
  if(kind==="traps") learned=state.learnedTraps||[];
  const set=new Set(learned.map(String));
  return pool.filter(q=>{
    if(kind==="vocab") return set.has(String((q.base.match(/^vocab:(.*)$/)||[])[1]||""));
    if(kind==="grammar") return set.has(String((q.base.match(/^grammar:(.*)$/)||[])[1]||""));
    if(kind==="verbs") return set.has(String((q.base.match(/^verbs:(.*)$/)||[])[1]||""));
    if(kind==="kanji") return set.has(String((q.base.match(/^kanji:(.*)$/)||[])[1]||""));
    if(kind==="traps") return set.has(String((q.base.match(/^traps:(.*)$/)||[])[1]||""));
    return false;

let lessonSession=null;
function hasKanji(s){ return /[\u3400-\u9fff]/.test(String(s||"")); }
function rubyWord(word, reading){
  word=String(word||""); reading=String(reading||"");
  if(!word) return "";
  if(!hasKanji(word)||!reading) return esc(word);
  // Align matching trailing kana, so e.g. 食べる becomes 食（た）べる and 私たち becomes 私（わたし）たち.
  const suffix=(word.match(/[ぁ-ゖァ-ヺー]+$/)||[""])[0];
  if(suffix && word.length>suffix.length && reading.endsWith(suffix)){
    const base=word.slice(0,-suffix.length), baseReading=reading.slice(0,-suffix.length);
    if(base && baseReading) return `<ruby>${esc(base)}<rt>${esc(baseReading)}</rt></ruby>${esc(suffix)}`;
  }
  return `<ruby>${esc(word)}<rt>${esc(reading)}</rt></ruby>`;
}
// Best-effort furigana for grammar examples, matching known vocabulary from longest to shortest.
function rubySentence(sentence){
  const text=String(sentence||"");
  const rows=(DATA.vocab||[]).filter(r=>r["日文表记"]&&r["假名读音"]&&hasKanji(r["日文表记"]))
    .sort((a,b)=>String(b["日文表记"]).length-String(a["日文表记"]).length);
  if(!rows.length) return esc(text);
  const map=new Map(rows.map(r=>[String(r["日文表记"]),String(r["假名读音"])]));
  const tokens=[...map.keys()].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).sort((a,b)=>b.length-a.length);
  if(!tokens.length) return esc(text);
  const re=new RegExp(tokens.join("|"),"g"); let out="", last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    out+=rubyWord(m[0],map.get(m[0])); last=m.index+m[0].length;
  }
  out+=esc(text.slice(last)); return out;
}
function speakJapanese(text){

    const vs=window.speechSynthesis.getVoices(); const ja=vs.find(v=>/^ja([-_]|$)/i.test(v.lang)); if(ja)u.voice=ja;

function finishLessonAndQuiz(){

  else if(kind==="grammar") ids=records.map(r=>String(r["序号"]));

  else if(kind==="kanji") ids=records.map(r=>String(r["序号"]));
  else ids=records.map((r,i)=>String(l.from+i));

function createRound(kind){
  let list=[];
  if(kind==="daily"){
    list=[...sample(getLearnedPool("vocab"),3),...sample(getLearnedPool("grammar"),3),...sample(getLearnedPool("verbs"),2),...sample(getLearnedPool("kanji"),1),...sample(getLearnedPool("traps"),1)];
  }else if(kind==="review"){
    list=sample(allMissedPool(),10);
  }else{

  }
  const chosen=[], bases=new Set();
  for(const q of shuffle(list)){ if(!bases.has(q.base)){chosen.push(q);bases.add(q.base);} }

}

      <div class="game-kicker">${esc(MODES[game.kind]?.name||"挑战")}　/　${label}　·　题目 ${game.index+1}/${game.questions.length}</div>
      <div style="margin-top:24px" class="question-prompt">选择正确答案</div>
      <h2>${q.kind==="vocab" && q.id.endsWith(":jp-cn") ? rubyWord(q.prompt,(DATA.vocab.find(r=>`vocab:${r["序号"]}:jp-cn`===q.id)||{})["假名读音"]||"") : q.kind==="kanji" ? (()=>{const kr=DATA.kanji.find(r=>`kanji:${r["序号"]}`===q.id)||{};return `汉字「${rubyWord(kr["汉字"]||q.prompt,kr["词例读音"]||kr["常见读音"]||"")}」的常见含义是？`;})() : esc(q.prompt)}</h2>
      <p class="question-sub">${esc(q.sub||"")}</p>
      <div class="choices">${game.currentOptions.map(opt=>`<button class="choice" data-action="answer" data-value="${esc(opt)}">${esc(opt)}</button>`).join("")}</div>
      <div id="feedback" class="feedback"><strong id="feedback-title"></strong><p id="feedback-body"></p></div>
      <div class="game-actions"><span class="muted-small">连击 ×${game.combo}　·　本局 +${game.earned} XP</span><button class="next-button" id="next-button" data-action="next" disabled>检查答案</button></div>
    </div>
  </section>`;
}
function detailsHtml(q){
  return (q.detail||[]).filter(Boolean).map(s=>`<div>${esc(s)}</div>`).join("");
}
function registerStudy(){
  const today=todayKey();
  if(state.lastStudyDate!==today){
    state.streak = state.lastStudyDate===yesterdayKey() ? state.streak+1 : 1;
    state.lastStudyDate=today;
  }
}
function chooseAnswer(value){
  if(!game||game.locked)return;
  game.locked=true;
  const q=game.questions[game.index], ok=String(value)===String(q.answer);
  game.answered++;state.answered++;game.answered=game.answered;
  document.querySelectorAll(".choice").forEach(b=>{
    if(b.dataset.value===String(q.answer))b.classList.add("correct");
    if(b.dataset.value===String(value)&&!ok)b.classList.add("wrong");
    b.disabled=true;
  });
  const fb=$("#feedback");fb.classList.add("show",ok?"good":"bad");
  $("#feedback-title").textContent=ok?"答对了！ +10 XP":"再记一遍，错题已收录";
  let msg=ok?"做得好！":`正确答案：${q.answer}`;
  const extras=detailsHtml(q);
  $("#feedback-body").innerHTML=`${esc(msg)}${ok?"":""}${extras?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid currentColor;opacity:.9">${extras}</div>`:""}`;
  if(ok){
    game.combo++;game.correct++;state.correct++;registerStudy();
    const bonus=game.combo>0&&game.combo%3===0?5:0;
    const earned=10+bonus;game.earned+=earned;state.xp+=earned;state.dailyXP+=earned;
    if(bonus)$("#feedback-title").textContent=`连击 ×${game.combo}！ +${earned} XP`;
    delete state.missed[q.id];
  }else{
    game.combo=0;game.hearts=Math.max(0,game.hearts-1);
    state.missed[q.id]={kind:q.kind,when:todayKey()};
  }
  game.currentOptions.forEach((opt,i)=>{});
  saveState();updateTop();
  $(".hearts").textContent="❤️".repeat(game.hearts)+"🖤".repeat(5-game.hearts);
  $(".muted-small").textContent=`连击 ×${game.combo}　·　本局 +${game.earned} XP`;
  const btn=$("#next-button");btn.disabled=false;btn.textContent=(game.index===game.questions.length-1||game.hearts===0)?"查看结果 →":"继续 →";
}
function nextQuestion(){
  if(!game||!game.locked)return;
  if(game.hearts===0||game.index>=game.questions.length-1){finishRound();return;}
  game.index++;renderQuestion();
}
function finishRound(){
  if(game){
    state.sessions++;
    const today=todayKey();
    if(!game.lessonBatch && state.advancedDate!==today && state.day<32){state.day++;state.advancedDate=today;}
    saveState();
  }
  updateTop();
  const g=game;game=null;
  const acc=g&&g.answered?Math.round(g.correct/g.answered*100):0;
  $("#main-view").innerHTML=`<section class="game-wrap"><div class="result-card">
    <div class="result-emoji">${g&&g.hearts===0?"💪":acc>=80?"🏆":"🌱"}</div>
    <div class="game-kicker">CHALLENGE COMPLETE</div>
    <h2>${g&&g.hearts===0?"本局爱心用完了":"闯关完成！"}</h2>
    <p>${acc>=80?"状态很好，继续保持！": "每次答错都变成了下一次进步的线索。下一局重点复习错题即可。" }${g&&g.hearts===0?" 休息一下，再开一局会恢复 5 颗爱心。":""}</p>
    <div class="result-metrics"><div><b>+${g?g.earned:0}</b><span>获得 XP</span></div><div><b>${g?g.correct:0}/${g?g.answered:0}</b><span>答对题数</span></div><div><b>${acc}%</b><span>本局正确率</span></div></div>
    <p>当前待复习错题：<strong>${allMissedPool().length}</strong> 道 · 累计经验：<strong>${state.xp} XP</strong></p>
    <div class="result-buttons">${g&&g.lessonBatch?`<button class="primary" data-action="learn" data-kind="${esc(g.lessonKind)}">学习下一组${({vocab:"单词",grammar:"语法",verbs:"动词",kanji:"汉字",traps:"易错点"})[g.lessonKind]||"内容"} →</button><button class="secondary" data-action="start" data-kind="${esc(g.kind)}">再练一遍本类</button>`:`<button class="primary" data-action="start" data-kind="${esc(g?.kind||"daily")}">再来一局 →</button>`}<button class="secondary" data-action="start" data-kind="review">复习错题</button><button class="secondary" data-action="home">返回训练地图</button></div>
  </div></section>`;
}
function resetProgress(){
  if(confirm("确定清空这个浏览器里保存的 XP、连击、统计和错题吗？此操作无法撤销。")){
    try{localStorage.removeItem(STORE);}catch(e){}
    state=defaultState();renderHome();
  }
}
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action;
  if(a==="start")startRound(b.dataset.kind);
  if(a==="learn")startLesson(b.dataset.kind);
  if(a==="lesson-next"&&lessonSession){lessonSession.index=Math.min(lessonSession.items.length-1,lessonSession.index+1);renderLesson();}
  if(a==="lesson-prev"&&lessonSession){lessonSession.index=Math.max(0,lessonSession.index-1);renderLesson();}
  if(a==="lesson-finish")finishLessonAndQuiz();
  if(a==="speak")speakJapanese(b.dataset.text||"");
  if(a==="home"){lessonSession=null;renderHome();}
  if(a==="answer")chooseAnswer(b.dataset.value);
  if(a==="next")nextQuestion();
  if(a==="reset")resetProgress();
});
renderHome();
</script>
<script>
(()=>{
  const btn=document.getElementById('install-app');let promptEvent=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;if(btn)btn.style.display='inline-flex';});
  if(btn)btn.addEventListener('click',async()=>{if(!promptEvent){alert('若要安装为 App，请先从 HTTPS 网站打开应用；当前本地文件也可直接使用。');return;}promptEvent.prompt();try{await promptEvent.userChoice;}catch(e){}promptEvent=null;btn.style.display='none';});
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script>
